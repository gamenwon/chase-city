<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CHASE CITY 아트 샘플</title>
    <style>
      :root {
        font-family: "Noto Sans KR", system-ui, sans-serif;
        color: #2f3a4a;
        background: #cdebf2;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #cdebf2;
      }
      #art {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .label {
        position: fixed;
        padding: 6px 10px;
        border-radius: 999px;
        background: #ffffffd9;
        font-size: 12px;
        font-weight: 700;
        pointer-events: none;
      }
      .bar {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: #ffffffe6;
        box-shadow: 0 4px 16px #2f3a4a22;
      }
      .bar button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        min-height: 40px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        background: transparent;
        color: #2f3a4a;
        white-space: nowrap;
      }
      .bar button[aria-pressed="true"] {
        background: #ffb3c1;
      }
      .note {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: 12px;
        max-width: 230px;
        font-size: 11px;
        line-height: 1.5;
        background: #ffffffd9;
        padding: 8px 10px;
        border-radius: 10px;
        animation: fade 0.8s 6s forwards;
      }
      @keyframes fade {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (max-width: 600px) {
        .note {
          top: auto;
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px);
          left: 12px;
          right: 12px;
          max-width: none;
        }
        .bar button {
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="art" aria-label="현재 그래픽과 V2.0 아트 샘플 비교"></canvas>
    <span class="label">현재 (V1.9)</span>
    <span class="label">V2.0 샘플 · 파스텔 로우폴리</span>
    <p class="note">
      비교용 샘플입니다. 게임 화면은 아직 바뀌지 않았습니다. 드래그해서 돌려
      보세요.
    </p>
    <div class="bar" role="group" aria-label="보기">
      <button data-mode="both" aria-pressed="true">비교</button>
      <button data-mode="current" aria-pressed="false">현재</button>
      <button data-mode="sample" aria-pressed="false">샘플</button>
      <button id="spin">회전</button>
    </div>
    <script type="module" src="/src/art/sample.js"></script>
  </body>
</html>
